<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Photo/Text Shape Printer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Photo & Text Shape Printer</h1>

    <!-- Upload input -->
    <div class="section">
      <label class="label">Upload Photo:</label>
      <input type="file" accept="image/*" onchange="previewImage(event)">
    </div>

    <!-- Text input -->
    <div class="section">
      <label class="label">Enter Text:</label>
      <textarea id="textInput" placeholder="Type your text here..."></textarea>
    </div>

    <!-- Font selection -->
    <div class="section">
      <label class="label">Choose Font:</label>
      <select id="fontSelect" onchange="drawSegments()">
        <option value="Arial">Arial</option>
        <option value="Times New Roman">Times New Roman</option>
        <option value="Courier New">Courier New</option>
        <option value="Georgia">Georgia</option>
        <option value="Verdana">Verdana</option>
      </select>
      <br><br>
      <label class="label">Upload Your Own Font (.ttf/.otf):</label>
      <input type="file" accept=".ttf,.otf" onchange="uploadFont(event)">
    </div>

    <!-- Text size slider -->
    <div class="section">
      <label class="label">Text Size (0–100):</label>
      <input type="range" id="textSizeSlider" min="0" max="100" value="20" oninput="drawSegments()">
      <span id="textSizeValue">20</span> px
    </div>

    <!-- Dimension inputs -->
    <div class="section inputs">
      <label>Length (cm): <input type="number" step="0.1" id="lengthInput" value="5"></label>
      <label>Width (cm): <input type="number" step="0.1" id="widthInput" value="5"></label>
      <label>Distance (cm): <input type="number" step="0.1" id="distanceInput" value="0.5"></label>
    </div>

    <!-- Shape buttons -->
    <div class="section buttons">
      <button onclick="toggleShape('square')">Square</button>
      <button onclick="toggleShape('rectangle')">Rectangle</button>
      <button onclick="toggleShape('circle')">Circle</button>
    </div>

    <!-- Effect buttons -->
    <div class="section buttons">
      <button onclick="toggleEffect('flip')">Flip</button>
      <button onclick="toggleEffect('mirror')">Mirror</button>
      <button onclick="resetCanvas()">Reset</button>
      <button onclick="printCanvas()">Print</button>
    </div>

    <!-- Canvas for rendering -->
    <canvas id="canvasArea"></canvas>
  </div>

  <script src="script.js"></script>
</body>
</html>
