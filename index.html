<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chocolate Printer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Chocolate Printer</h1>

    <!-- Shape selection -->
    <div class="section">
      <h2>Choose Shape</h2>
      <div class="shapes">
        <button onclick="toggleShape('rectangle')">Rectangle<br><canvas id="rectSketch" width="60" height="40"></canvas></button>
        <button onclick="toggleShape('square')">Square<br><canvas id="squareSketch" width="50" height="50"></canvas></button>
        <button onclick="toggleShape('circle')">Circle<br><canvas id="circleSketch" width="60" height="60"></canvas></button>
      </div>
    </div>

    <!-- Size inputs -->
    <div class="section inputs">
      <label>Length (cm): <input type="number" step="0.1" id="lengthInput" value="5" oninput="drawSegments()"></label>
      <label>Width (cm): <input type="number" step="0.1" id="widthInput" value="5" oninput="drawSegments()"></label>
      <label>Space (cm): <input type="number" step="0.1" id="distanceInput" value="0.5" oninput="drawSegments()"></label>
    </div>

    <!-- Upload photo -->
    <div class="section">
      <h2>Upload Photo</h2>
      <input type="file" accept="image/*" onchange="previewImage(event)">
    </div>

    <!-- Text input -->
    <div class="section">
      <h2>Enter Text</h2>
      <textarea id="textInput" placeholder="Type your text here..."></textarea>
      <button onclick="confirmText()">Confirm</button>
    </div>

    <!-- Controls -->
    <div class="section buttons">
      <button onclick="toggleEffect('flip')">Flip</button>
      <button onclick="toggleEffect('mirror')">Mirror</button>
      <button onclick="resetCanvas()">Reset</button>
      <button onclick="printCanvas()">Print</button>
    </div>

    <!-- Output canvas -->
    <div class="section">
      <h2>Preview (A4 Layout)</h2>
      <canvas id="canvasArea"></canvas>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
