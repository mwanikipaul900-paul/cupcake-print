<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image/Text Upload with Shapes and Print</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>Upload Photo or Enter Text</h2>

  <!-- Upload input -->
  <input type="file" accept="image/*" onchange="previewImage(event)">
  <br><br>

  <!-- Text input -->
  <textarea id="textInput" placeholder="Enter text here"></textarea>
  <br><br>

  <!-- Dimension inputs -->
  <label>Length: <input type="number" id="lengthInput" value="200"></label>
  <label>Width: <input type="number" id="widthInput" value="200"></label>
  <label>Distance between prints: <input type="number" id="distanceInput" value="10"></label>
  <br><br>

  <!-- Shape buttons -->
  <button onclick="toggleShape('square')">Square</button>
  <button onclick="toggleShape('rectangle')">Rectangle</button>
  <button onclick="toggleShape('circle')">Circle</button>

  <!-- Effect buttons -->
  <button onclick="toggleEffect('flip')">Flip</button>
  <button onclick="toggleEffect('mirror')">Mirror</button>
  <button onclick="resetCanvas()">Reset</button>
  <button onclick="printCanvas()">Print</button>

  <!-- Canvas for rendering -->
  <canvas id="canvasArea"></canvas>

  <script src="script.js"></script>
</body>
</html>
