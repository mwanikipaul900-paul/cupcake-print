<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Upload with Shapes and Effects</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>Upload and Transform Your Photo</h2>

  <!-- Upload input -->
  <input type="file" accept="image/*" onchange="previewImage(event)">
  <br><br>

  <!-- Image display -->
  <img id="uploadedImage" alt="Uploaded Photo">

  <br><br>

  <!-- Shape buttons -->
  <button onclick="toggleShape('square')">Square</button>
  <button onclick="toggleShape('rectangle')">Rectangle</button>
  <button onclick="toggleShape('circle')">Circle</button>

  <!-- Effect buttons -->
  <button onclick="toggleEffect('flip')">Flip</button>
  <button onclick="toggleEffect('mirror')">Mirror</button>
  <button onclick="resetImage()">Reset</button>

  <script src="script.js"></script>
</body>
</html>
